[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty",
    "bandit>=1.7",
    "pytest-timeout>=2.3",
    "testcontainers[postgres,mysql]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "D"]
ignore = ["B009", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"packages/**/tests/**" = ["D"]
"packages/agentbox-models/alembic/**" = ["D"]
"apps/web/scripts/**" = ["D"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "agentbox_api.deps.require_permission",
]

[tool.ruff.lint.isort]
known-first-party = ["agentbox_harness", "agentbox_models", "agentbox_providers", "agentbox_api"]
