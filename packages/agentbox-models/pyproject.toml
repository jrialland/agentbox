[project]
name = "agentbox-models"
version = "0.1.0"
description = "Data model and persistence for Agentbox"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.14",
    "loguru>=0.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "agentbox-harness",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox_models"]

[tool.uv.sources]
agentbox-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
