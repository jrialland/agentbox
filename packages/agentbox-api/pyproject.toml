[project]
name = "agentbox-api"
version = "0.1.0"
description = "FastAPI backend for Agentbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "pydantic-settings>=2.0",
    "pydantic-ai[ag-ui]>=2.0",
    "agent-client-protocol>=1.0",
    "a2a-sdk[fastapi]>=1.3",
    "skills-ref>=0.1",
    "loguru>=0.7",
    "robohash>=2.0",
    "pillow>=9.1",
    "agentbox-models",
    "agentbox-providers",
    "agentbox-harness",
]

[project.scripts]
agentbox-acp = "agentbox_api.acp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox_api"]

[tool.uv.sources]
agentbox-models = { workspace = true }
agentbox-providers = { workspace = true }
agentbox-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
